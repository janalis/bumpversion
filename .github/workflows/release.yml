name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact SemVer version, or major | minor | patch'
        required: true
        default: patch
      dry_run:
        description: 'Prepare and verify artifacts without pushing or publishing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare version and curated changelog
        id: prepare
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: php bin/bumpversion release:prepare "$REQUESTED_VERSION" --tag-prefix=v --format=github >> "$GITHUB_OUTPUT"
      - name: Validate release metadata and notes
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag || github.ref_name }}
        run: |
          php bin/bumpversion release:notes --tag-prefix=v --format=json > "$RUNNER_TEMP/release.json"
          test "$RELEASE_TAG" = "$(jq -r .tag "$RUNNER_TEMP/release.json")"
          test "$(cat VERSION)" = "$(jq -r .version "$RUNNER_TEMP/release.json")"
          jq -r .notes "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-notes.md"
          jq -r '"tag=\(.tag)\nversion=\(.version)\nprerelease=\(.prerelease)"' "$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: make verify
      - name: Include curated release notes
        run: cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md
      - name: Commit and tag the verified release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email "$RELEASE_ACTOR_ID+$RELEASE_ACTOR@users.noreply.github.com"
          git commit -m "Release $RELEASE_TAG" -- VERSION bumpversion.yaml.dist CHANGELOG.md
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bumpversion-dist
          path: dist/
  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-plugins --no-interaction --prefer-dist --no-progress
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bumpversion-dist
          path: dist
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: >-
          php bin/bumpversion release:github --repository="$RELEASE_REPOSITORY"
          --release-version="$RELEASE_VERSION" --commit="$RELEASE_SHA" --tag-prefix=v
          --notes-file=dist/release-notes.md --asset=dist/bumpversion.phar
          --asset=dist/SHA256SUMS --asset=dist/manifest.txt
  packagist:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - name: Refresh and verify the exact Packagist release
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: >-
          php bin/bumpversion release:packagist --release-version="$RELEASE_VERSION"
          --commit="$RELEASE_SHA" --package=janalis/bumpversion
  docs:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs: [build, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
