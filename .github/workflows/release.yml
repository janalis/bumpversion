name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact SemVer version, or major | minor | patch'
        required: true
        default: patch
      dry_run:
        description: 'Prepare and verify artifacts without pushing or publishing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare version and curated changelog
        id: prepare
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: php tools/prepare-release.php "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate release metadata and notes
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag || github.ref_name }}
        run: |
          php tools/release-notes.php "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          php -r 'require "vendor/autoload.php"; $v = Janalis\Bumpversion\Version\SemanticVersion::parse(substr(getenv("RELEASE_TAG"), 1)); echo "prerelease=".($v->preRelease !== null ? "true" : "false").PHP_EOL;' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: make verify
      - name: Include curated release notes
        run: cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md
      - name: Commit and tag the verified release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email "$RELEASE_ACTOR_ID+$RELEASE_ACTOR@users.noreply.github.com"
          git commit -m "Release $RELEASE_TAG" -- VERSION bumpversion.yaml.dist CHANGELOG.md
          git tag -a "$RELEASE_TAG" -m "Bumpversion $RELEASE_TAG"
          git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bumpversion-dist
          path: dist/
  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name bumpversion-dist --dir dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/existing"
            cmp dist/SHA256SUMS "$RUNNER_TEMP/existing/SHA256SUMS"
            echo "Release already published with the verified checksum."
          else
            extra=()
            if [ "$PRERELEASE" = true ]; then extra+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/bumpversion.phar dist/SHA256SUMS dist/manifest.txt --verify-tag --target "$RELEASE_SHA" --title "Bumpversion $RELEASE_TAG" --notes-file dist/release-notes.md "${extra[@]}"
          fi
  packagist:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress
      - name: Request immediate Packagist refresh when credentials are configured
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "$PACKAGIST_USERNAME" ] && [ -n "$PACKAGIST_TOKEN" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
              -d '{"repository":"https://github.com/janalis/bumpversion"}' \
              https://packagist.org/api/update-package > /dev/null
          else
            echo "Using the configured Packagist GitHub push webhook."
          fi
      - name: Verify Packagist indexed the exact release commit
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: php tools/verify-packagist.php "$RELEASE_VERSION" "$RELEASE_SHA"
  docs:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    needs: [build, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.build.outputs.sha }}
